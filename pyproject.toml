[project]
name = "librarian"
version = "0.2.13"
description = "Agent-first document library search: hybrid BM25+vector over PDF/PPTX/DOCX/TXT/MSG, exposed as CLI + MCP server"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "EverythingsComputer"}]
dependencies = [
    "python-pptx>=1.0",
    "python-docx>=1.1",
    "extract-msg>=0.48",
    "fastembed>=0.4",
    "sqlite-vec>=0.1.6",
    "mcp>=1.2",
    "uvicorn>=0.30",
    "httpx>=0.27",
]

[project.scripts]
librarian = "librarian.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["librarian*"]
